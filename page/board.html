<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Reload every 30 minutes so a new scan shows up without touching anything -->
<meta http-equiv="refresh" content="1800">
<meta name="robots" content="noindex, nofollow">
<title>JobScout</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #ece8df; --card: #ffffff; --text: #1d1b18; --muted: #6b665d;
    --line: #ddd7cb; --accent: #b5341a; --p0: #b5341a; --p1: #2f6f9f; --p2: #7a5c3a; --p3: #6b665d;
    --fit0: #e9e5dc; --fit1: #f3dfb3; --fit2: #cfe8c6; --ok: #2e7d32; --warn: #b26a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513; --panel: #1f1d1a; --card: #282622; --text: #eeeae2; --muted: #a39d92;
      --line: #3a3732; --accent: #e0714f; --p0: #e0714f; --p1: #6aaee0; --p2: #c9a27a; --p3: #a39d92;
      --fit0: #34312c; --fit1: #574a2c; --fit2: #2f4a2b; --ok: #7bc47f; --warn: #e0a64f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1300px; margin: 0 auto; padding: 0 16px; }
  header { padding: 20px 0 8px; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; }
  h1 { margin: 0; font-size: 22px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; }

  /* Stats bar */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 8px 0 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .stat .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .detail { font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

  /* Filters */
  .filters { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; margin-bottom: 12px; font-size: 13px; }
  .group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .group > span { color: var(--muted); margin-right: 4px; }
  .chip { font: inherit; font-size: 13px; color: var(--text); background: var(--card); border: 1px solid var(--line);
          border-radius: 999px; padding: 3px 12px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toggle { margin-left: auto; color: var(--muted); }

  main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding-bottom: 32px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } .toggle { margin-left: 0; } }
  .column { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  h2 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: center; }
  .count { font-size: 12px; background: var(--card); border: 1px solid var(--line);
           border-radius: 999px; padding: 1px 8px; color: var(--muted); }
  .note { margin: 2px 0 10px; font-size: 12px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .top, .bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .company { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .fit { font-size: 11px; border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
  .fit0 { background: var(--fit0); } .fit1 { background: var(--fit1); } .fit2 { background: var(--fit2); }
  .title { display: block; margin: 4px 0; color: var(--text); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
  .title:hover { color: var(--accent); text-decoration: underline; }
  .meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .place { font-size: 11px; font-weight: 700; margin-right: 4px; }
  .p0 { color: var(--p0); } .p1 { color: var(--p1); } .p2 { color: var(--p2); } .p3 { color: var(--p3); }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .bottom { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .hide { font: inherit; font-size: 12px; color: var(--muted); background: none;
          border: 1px solid var(--line); border-radius: 4px; padding: 1px 8px; cursor: pointer; }
  .hide:hover { color: var(--text); }

  .private-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .private-row input { flex: 1; min-width: 180px; font: inherit; padding: 4px 8px; border: 1px solid var(--line);
                       border-radius: 6px; background: var(--bg); color: var(--text); }
  .private-status { color: var(--muted); margin-top: 6px !important; }
  .draft { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .draft .match { font-weight: 700; color: var(--text); }
  .card.hidden { opacity: .45; }
  .empty { color: var(--muted); font-size: 13px; }
  /* Account (log in with an email link) */
  .account-toggle { margin-left: auto; }
  .account-box { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
  .account-box p { margin: 0 0 8px; }
  .account-box textarea { width: 100%; min-height: 140px; font: 12px/1.4 ui-monospace, monospace; padding: 6px 8px;
                          border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  .cv-area { margin: 8px 0; }
  .links { line-height: 1.8; }
  [hidden] { display: none !important; } /* "hidden" must win over layout styles like flex */
  .links a { color: var(--accent); white-space: nowrap; }
  .ask { margin-left: auto; color: var(--accent); border-color: var(--accent); white-space: nowrap; }
  .prompt-box { width: 100%; height: 120px; margin-top: 6px; font: 11px/1.4 ui-monospace, monospace; }
  /* My applications */
  .apps-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding-bottom: 32px; }
  @media (max-width: 860px) { .apps-grid { grid-template-columns: 1fr; } }
  .app-form { margin-bottom: 12px; }
  .app-form input, .app-form select { font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--line);
                                      border-radius: 6px; background: var(--bg); color: var(--text); min-width: 140px; flex: 1; }
  .stage { font: inherit; font-size: 12px; background: var(--bg); color: var(--text); border: 1px solid var(--line);
           border-radius: 4px; padding: 1px 4px; }
  .notes { width: 100%; min-height: 44px; margin-top: 6px; font: inherit; font-size: 12px; padding: 4px 6px;
           border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  .history { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .next { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .next input { font: inherit; font-size: 12px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px;
                background: var(--bg); color: var(--text); min-width: 0; }
  .next input[type=text] { flex: 1 1 100%; } /* the step on its own line, the date below */
  .card.overdue { border-color: var(--warn); }
  .due { font-size: 11px; font-weight: 700; color: var(--warn); }
  .applied-tag { color: var(--ok); border-color: var(--ok); }
</style>
<!-- Login and private data (hidden jobs, applications): Supabase. The key below is the
     public "publishable" key; database rules let each logged-in user see only their own rows. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="page-title">Job<span>Scout</span></h1>
    <span class="sub" id="updated"></span>
    <button type="button" class="chip account-toggle" id="account-toggle">Log in</button>
    <button type="button" class="chip" id="apps-toggle" aria-pressed="false" hidden>My applications</button>
  </header>
  <!-- Log in once per device with a link sent by email; hidden jobs then sync on all devices -->
  <section class="account-box" id="account-box" hidden>
    <p id="account-text"></p>
    <div class="private-row" id="account-form">
      <input type="email" id="account-email" placeholder="you@example.com" autocomplete="email">
      <button type="button" class="chip" id="account-send">Send login link</button>
    </div>
    <div class="cv-area" id="cv-area" hidden>
      <p>My CV (plain text). Used for the match % on each job and for Fit my CV. Only you can see it.</p>
      <textarea id="cv-text" spellcheck="false"></textarea>
      <button type="button" class="chip" id="cv-save">Save CV</button>
    </div>
    <!-- My links: only after login. The sheet itself is linked from the Notion page, never here,
         because this page is public. -->
    <p class="links" id="account-links" hidden>
      <b>My links:</b>
      <a href="https://github.com/BarboneBarbaPersonal/JobScout/blob/main/TASKS.md" target="_blank" rel="noopener">Task list</a> ·
      <a href="https://github.com/BarboneBarbaPersonal/JobScout/actions/workflows/scan.yml" target="_blank" rel="noopener">Scan runs</a> ·
      <a href="https://github.com/BarboneBarbaPersonal/JobScout/pulls" target="_blank" rel="noopener">Changes to approve</a> ·
      <a href="https://supabase.com/dashboard/project/pffopwzydbjdblojhcwm" target="_blank" rel="noopener">Database</a> ·
      <a href="https://app.notion.com/p/3eaa4ae1560781149128c256247ec482" target="_blank" rel="noopener">All my links (Notion)</a>
    </p>
    <button type="button" class="chip" id="account-logout" hidden>Log out</button>
    <p class="private-status" id="account-status"></p>
  </section>
  <!-- My applications (after login): replaces the board while open -->
  <section id="apps" hidden>
    <div class="private-row app-form">
      <input id="app-company" placeholder="Company">
      <input id="app-title" placeholder="Role">
      <input id="app-location" placeholder="Location">
      <input id="app-link" placeholder="Link to the job (optional)">
      <select id="app-source">
        <option value="linkedin">LinkedIn</option><option value="referral">Referral</option>
        <option value="recruiter">Recruiter</option><option value="other">Other</option>
      </select>
      <button type="button" class="chip" id="app-add">Add application</button>
    </div>
    <p class="private-status" id="apps-status"></p>
    <div class="apps-grid" id="apps-board"></div>
  </section>
  <section class="stats" id="stats"></section>
  <section class="filters">
    <div class="group" id="place-filter"><span>Location</span></div>
    <div class="group" id="role-filter"><span>Role</span></div>
    <label class="toggle"><input type="checkbox" id="show-hidden"> show hidden</label>
  </section>
  <main id="board"></main>
</div>
<script type="application/json" id="data">{{DATA}}</script>
<script>
  // All page data (jobs + stats) is embedded above by scout/board.py.
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var stats = DATA.stats;
  var filters = { place: "All", role: "All" };
  var showHidden = false;

  // ---- small helpers ----
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function ago(iso) {
    if (!iso) return "never";
    var minutes = Math.round((Date.now() - new Date(iso)) / 60000);
    if (minutes < 60) return minutes + " min ago";
    if (minutes < 48 * 60) return Math.round(minutes / 60) + " h ago";
    return Math.round(minutes / 1440) + " days ago";
  }
  function dayAge(iso) {
    var days = Math.floor((Date.now() - new Date(iso)) / 86400000);
    return days <= 0 ? "today" : days + "d ago";
  }
  function num(value) { return value === null || value === undefined ? "-" : value.toLocaleString("en-US"); }

  // ---- "Hide" remembers dismissed jobs in this browser only (per device) ----
  var KEY = "jobscout-hidden";
  var hidden = [];
  try { hidden = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { hidden = []; }
  function saveHidden() {
    try { localStorage.setItem(KEY, JSON.stringify(hidden)); } catch (e) {}
  }

  // ---- stats bar ----
  function renderStats() {
    document.getElementById("updated").textContent =
      "Page built " + ago(stats.updated) + " · scans every hour · jobs older than " + DATA.max_age_days + " days are removed";
    var healthy = stats.boards && stats.boards_ok === stats.boards;
    var items = [
      ["Last scan", ago(stats.last_scan), (stats.scans_24h || 0) + (stats.scans_24h === 1 ? " scan" : " scans") + " in last 24 h", healthy ? "var(--ok)" : "var(--warn)"],
      ["Jobs scanned", num(stats.scanned), num(stats.boards_ok) + " / " + num(stats.boards) + " company boards OK"],
      ["New postings", num(stats.new_postings_24h), num(stats.new_postings_last) + " in last scan · all titles, 24 h"],
      ["Matches on board", num(stats.total), num(stats.new_matches_24h) + " new in last 24 h"],
      [DATA.places[0], num(stats.places[DATA.places[0]]), DATA.places.slice(1).map(function (p) { return p + " " + num(stats.places[p]); }).join(" · ")],
      ["Core roles", num(stats.core), "Also interested " + num(stats.total - stats.core)]
    ];
    var box = document.getElementById("stats");
    items.forEach(function (item) {
      var stat = el("div", "stat");
      var label = el("div", "label");
      if (item[3]) { var dot = el("span", "dot"); dot.style.background = item[3]; label.appendChild(dot); }
      label.appendChild(document.createTextNode(item[0]));
      stat.appendChild(label);
      stat.appendChild(el("div", "value", item[1]));
      stat.appendChild(el("div", "detail", item[2]));
      box.appendChild(stat);
    });
  }

  // ---- filter chips ----
  function renderChips(boxId, key, options) {
    var box = document.getElementById(boxId);
    options.forEach(function (option) {
      var chip = el("button", "chip", option[1]);
      chip.type = "button";
      chip.dataset.value = option[0];
      chip.setAttribute("aria-pressed", String(filters[key] === option[0]));
      chip.addEventListener("click", function () {
        filters[key] = option[0];
        box.querySelectorAll(".chip").forEach(function (c) {
          c.setAttribute("aria-pressed", String(c.dataset.value === filters[key]));
        });
        renderBoard();
      });
      box.appendChild(chip);
    });
  }

  // ---- job cards and columns ----
  function card(job) {
    var isHidden = hidden.indexOf(job.id) !== -1;
    var node = el("article", "card" + (isHidden ? " hidden" : ""));
    var top = el("div", "top");
    top.appendChild(el("span", "company", job.company));
    var maxFit = DATA.places.length * 2 + 2;
    var fit = el("span", "fit fit" + Math.min(Math.floor(job.fit / maxFit * 3), 2), "fit " + job.fit);
    fit.title = "Fit score " + job.fit + "/" + maxFit + " (location x2 + role)";
    top.appendChild(fit);
    node.appendChild(top);

    var link = el("a", "title", job.title);
    link.href = job.url; link.target = "_blank"; link.rel = "noopener";
    node.appendChild(link);

    var meta = el("div", "meta");
    meta.appendChild(el("span", "place p" + Math.min(Math.max(DATA.places.indexOf(job.place), 0), 3) + (job.place === "Other" ? " p3" : ""), job.place));
    meta.appendChild(document.createTextNode(job.location + " "));
    meta.appendChild(el("span", "tag", job.role === "core" ? "core" : "also"));
    if (job.work_mode) meta.appendChild(el("span", "tag", job.work_mode)); // remote / hybrid / onsite
    node.appendChild(meta);

    // Match % and missing keywords, only after login with a saved CV.
    var draft = draftLine(job);
    if (draft) node.appendChild(draft);

    var bottom = el("div", "bottom");
    var when = (job.posted_at ? "posted " + dayAge(job.posted_at) + " · " : "") + "found " + dayAge(job.found_at);
    bottom.appendChild(el("span", "", when));
    if (USER && CV) bottom.appendChild(askButton(job));
    if (USER) bottom.appendChild(appliedButton(job));
    var button = el("button", "hide", isHidden ? "Unhide" : "Hide");
    button.type = "button";
    button.addEventListener("click", function () {
      var index = hidden.indexOf(job.id);
      if (index === -1) { hidden.push(job.id); } else { hidden.splice(index, 1); }
      saveHidden();
      if (USER) {
        saveHiddenToDatabase(job.id, index === -1);
      } else {
        // Not logged in: the hide lives only in this browser and can be wiped. Say so.
        toggleAccountBox(true);
        document.getElementById("account-status").textContent =
          "Hidden on this browser only. Log in to keep hidden jobs on all your devices.";
      }
      renderBoard();
    });
    bottom.appendChild(button);
    node.appendChild(bottom);
    return node;
  }

  function column(title, note, jobs) {
    var section = el("section", "column");
    var heading = el("h2", "", title + " ");
    heading.appendChild(el("span", "count", String(jobs.length)));
    section.appendChild(heading);
    section.appendChild(el("p", "note", note));
    if (!jobs.length) section.appendChild(el("p", "empty", "Nothing here."));
    jobs.forEach(function (job) { section.appendChild(card(job)); });
    return section;
  }

  function renderBoard() {
    var newCutoff = Date.now() - DATA.new_for_hours * 3600000;
    // Apply the filters (and hide dismissed jobs unless "show hidden" is ticked).
    var jobs = DATA.jobs.filter(function (job) {
      if (filters.place !== "All" && job.place !== filters.place) return false;
      if (filters.role !== "All" && job.role !== filters.role) return false;
      if (!showHidden && hidden.indexOf(job.id) !== -1) return false;
      return true;
    });
    // Best fit first; ties go to the most recently found.
    jobs.sort(function (a, b) { return b.fit - a.fit || (b.found_at > a.found_at ? 1 : -1); });

    var fresh = jobs.filter(function (job) { return new Date(job.found_at) >= newCutoff; });
    var best = jobs.slice(0, 10);
    var used = {};
    fresh.concat(best).forEach(function (job) { used[job.id] = true; });
    var older = jobs.filter(function (job) { return !used[job.id]; });

    var board = document.getElementById("board");
    board.textContent = "";
    board.appendChild(column("New", "First seen in the last " + DATA.new_for_hours + " hours", fresh));
    board.appendChild(column("Best fit", "Top 10: " + DATA.places.join(" > ") + ", core roles first", best));
    board.appendChild(column("Older", "Everything else still open", older));
  }

  // =====================================================================
  // CV help (after login): instant keyword match on each card, and
  // "Fit my CV", which copies a ready prompt (job + CV) for the Claude app's fit-cv skill.
  // The CV text lives in the private database (table "profile").
  // =====================================================================
  var CV = "";
  var DESCRIPTIONS = {}; // job id -> description, from matches.json (public job ads)

  // Terms that matter in Customer Success / TAM job ads. A job's match % is the share
  // of the terms its description uses that the CV also mentions.
  var VOCABULARY = ["customer success", "customer journey", "onboarding", "adoption", "renewal", "renewals",
    "expansion", "upsell", "cross-sell", "churn", "retention", "nrr", "grr", "arr", "health score",
    "success plan", "qbr", "ebr", "business review", "executive sponsor", "stakeholder management",
    "escalation", "escalations", "value realization", "roi", "kpi", "okr", "nps", "csat",
    "customer advocacy", "playbook", "playbooks", "enablement", "workshops", "account planning",
    "forecasting", "negotiation", "digital customer success", "enterprise", "mid-market", "smb",
    "strategic accounts", "portfolio", "trusted advisor", "technical account manager", "implementation",
    "integration", "integrations", "migration", "api", "apis", "sql", "python", "javascript",
    "kubernetes", "docker", "aws", "azure", "gcp", "cloud", "saas", "observability", "monitoring",
    "security", "devops", "ci/cd", "terraform", "jenkins", "gitlab", "github", "linux", "networking",
    "analytics", "dashboards", "troubleshooting", "technical demos", "poc", "proof of concept",
    "solution design", "architecture", "professional services", "sla", "incident management", "itil",
    "service delivery", "ai", "llm", "llms", "generative ai", "machine learning", "prompt engineering",
    "agents", "ai agents", "automation", "salesforce", "gainsight", "totango", "churnzero", "hubspot",
    "zendesk", "jira", "confluence", "tableau", "power bi", "looker", "excel", "slack",
    "cross-functional", "change management", "project management", "communication",
    "spanish", "italian", "english", "portuguese", "french", "german"];

  function termRegex(term) {
    return new RegExp("(?<![\\w-])" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![\\w-])", "gi");
  }

  // Match for one job: share of the job's important terms that the CV mentions.
  function draft(job) {
    var text = DESCRIPTIONS[job.id];
    if (!CV || !text) return null;
    var found = [];
    VOCABULARY.forEach(function (term) {
      var hits = (text.match(termRegex(term)) || []).length;
      if (hits) found.push({ term: term, count: hits, inCv: termRegex(term).test(CV) });
    });
    if (!found.length) return null;
    found.sort(function (a, b) { return b.count - a.count; });
    var present = found.filter(function (f) { return f.inCv; }).length;
    return { match: Math.round(100 * present / found.length),
             missing: found.filter(function (f) { return !f.inCv; }).slice(0, 4) };
  }

  function draftLine(job) {
    var d = draft(job);
    if (!d) return null;
    var line = el("div", "draft");
    line.appendChild(el("span", "match", d.match + "% match"));
    if (d.missing.length) {
      line.appendChild(document.createTextNode(" · missing: " +
        d.missing.map(function (m) { return m.term; }).join(", ")));
    }
    return line;
  }

  // The prompt for the Claude app: it starts the fit-cv skill (skills/fit-cv/SKILL.md in the
  // repo), which tailors the CV to this job and saves it as a Google Doc.
  function claudePrompt(job) {
    return "Use my fit-cv skill: tailor my CV to the job below, facts only, and save it as a Google Doc.\n\n" +
      "JOB: " + job.title + " at " + job.company + " (" + job.location + ")\n" + job.url + "\n\n" +
      "--- JOB AD ---\n" + (DESCRIPTIONS[job.id] || "(Open the link above: the ad text was not available.)") +
      "\n\n--- MY CV ---\n" + CV;
  }

  // Copy the prompt, then open Claude in a new tab: paste it there.
  function askClaude(job, button) {
    var text = claudePrompt(job);
    navigator.clipboard.writeText(text).then(function () {
      button.textContent = "Copied: paste in Claude";
      window.open("https://claude.ai/new", "_blank", "noopener");
    }, function () {
      // Copying is blocked on some phones: show the prompt, selected, to copy by hand.
      var card = button.closest(".card");
      var box = card.querySelector(".prompt-box") || card.appendChild(el("textarea", "prompt-box"));
      box.value = text;
      box.readOnly = true;
      box.focus();
      box.select();
      button.textContent = "Copy the text below";
    });
    setTimeout(function () { button.textContent = "Fit my CV"; }, 4000);
  }

  function askButton(job) {
    var button = el("button", "hide ask", "Fit my CV");
    button.type = "button";
    button.title = "Copies this job and your CV for the fit-cv skill, then opens Claude: paste it there. The tailored CV comes back as a Google Doc.";
    button.addEventListener("click", function () { askClaude(job, button); });
    return button;
  }

  // The CV and the job descriptions, loaded after login.
  function loadCv() {
    db.from("profile").select("cv_text").maybeSingle().then(function (result) {
      CV = (result.data && result.data.cv_text) || "";
      document.getElementById("cv-text").value = CV;
      if (!CV) migrateFromGitHub();
      renderBoard();
    });
    fetch("matches.json").then(function (r) { return r.json(); }).then(function (jobs) {
      jobs.forEach(function (job) { if (job.description) DESCRIPTIONS[job.id] = job.description; });
      renderBoard();
    }).catch(function () {});
  }

  function saveCv() {
    var status = document.getElementById("account-status");
    CV = document.getElementById("cv-text").value;
    db.from("profile").upsert({ cv_text: CV, updated_at: new Date().toISOString() }, { onConflict: "user_id" })
      .then(function (result) {
        status.textContent = result.error ? "Could not save the CV: " + result.error.message : "CV saved.";
        renderBoard();
      });
  }

  // One-time move from the old setup (a GitHub key saved in this browser, private repo
  // jobscout-cv): copy the CV and the old hidden-jobs list, then forget the key.
  function migrateFromGitHub() {
    var token = "";
    try { token = localStorage.getItem("jobscout-cv-token") || ""; } catch (e) {}
    if (!token) return;
    var repo = "https://api.github.com/repos/BarboneBarbaPersonal/jobscout-cv";
    var headers = { "Authorization": "Bearer " + token, "Accept": "application/vnd.github.raw+json" };
    var cvRequest = fetch(repo + "/contents/cv/master.md", { headers: headers })
      .then(function (r) { return r.ok ? r.text() : ""; });
    var issuesRequest = fetch(repo + "/issues?state=all&per_page=100", { headers: { "Authorization": "Bearer " + token } })
      .then(function (r) { return r.ok ? r.json() : []; });
    Promise.all([cvRequest, issuesRequest]).then(function (all) {
      if (all[0]) { document.getElementById("cv-text").value = all[0]; saveCv(); }
      all[1].forEach(function (issue) {
        if (issue.title !== "JobScout hidden jobs") return;
        (issue.body || "").split("\n").slice(1).forEach(function (line) {
          var id = line.trim();
          if (id && hidden.indexOf(id) === -1) hidden.push(id);
        });
      });
      saveHidden();
      syncHidden();
      if (all[0]) { try { localStorage.removeItem("jobscout-cv-token"); } catch (e) {} }
    }).catch(function () {});
  }

  // ---- Account and private data (Supabase) ----
  var SUPABASE_URL = "https://pffopwzydbjdblojhcwm.supabase.co";
  var SUPABASE_KEY = "sb_publishable_qs5yz6gDAqx3WGJ2qzy_mw_NtOgQzKS";
  var db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
  var USER = null;

  function toggleAccountBox(show) {
    var box = document.getElementById("account-box");
    box.hidden = show === undefined ? !box.hidden : !show;
  }

  function showAccount() {
    document.getElementById("account-toggle").textContent = USER ? "Logged in" : "Log in";
    document.getElementById("account-form").hidden = !!USER;
    document.getElementById("account-logout").hidden = !USER;
    document.getElementById("account-links").hidden = !USER;
    document.getElementById("apps-toggle").hidden = !USER;
    var due = APPS.filter(isDue).length;
    document.getElementById("apps-toggle").textContent =
      "My applications (" + APPS.length + (due ? " \u00b7 " + due + " due" : "") + ")";
    document.getElementById("cv-area").hidden = !USER;
    document.getElementById("account-text").textContent = USER
      ? "Logged in as " + USER.email + ". Hidden jobs sync on all your devices."
      : "Log in to keep hidden jobs (and later your applications) in sync on all your devices. " +
        "Type your email and open the link we send you on this device.";
  }

  // Save one hide or unhide in the database.
  function saveHiddenToDatabase(jobId, isHidden) {
    var request = isHidden
      ? db.from("hidden_jobs").upsert({ job_id: jobId }, { onConflict: "user_id,job_id" })
      : db.from("hidden_jobs").delete().eq("job_id", jobId);
    request.then(function (result) {
      if (result.error) document.getElementById("account-status").textContent = "Could not save: " + result.error.message;
    });
  }

  // Database list + this browser's list, so nothing hidden on any device is lost.
  function syncHidden() {
    if (!USER) return;
    db.from("hidden_jobs").select("job_id").then(function (result) {
      if (result.error) { document.getElementById("account-status").textContent = "Could not load: " + result.error.message; return; }
      var remote = result.data.map(function (row) { return row.job_id; });
      var missing = hidden.filter(function (id) { return remote.indexOf(id) === -1; });
      hidden = remote.concat(missing);
      saveHidden();
      if (missing.length) {
        db.from("hidden_jobs").upsert(missing.map(function (id) { return { job_id: id }; }),
                                      { onConflict: "user_id,job_id" }).then(function () {});
      }
      renderBoard();
    });
  }

  function startAccount() {
    showAccount();
    if (!db) { document.getElementById("account-toggle").hidden = true; return; }
    // Hides and unhides made on another device arrive here while the page is open.
    db.channel("hidden-jobs").on("postgres_changes", { event: "*", schema: "public", table: "hidden_jobs" },
      function (change) {
        var id = (change.new && change.new.job_id) || (change.old && change.old.job_id);
        var index = hidden.indexOf(id);
        if (change.eventType === "DELETE" && index !== -1) hidden.splice(index, 1);
        if (change.eventType === "INSERT" && index === -1) hidden.push(id);
        saveHidden();
        renderBoard();
      }).subscribe();
    db.channel("applications").on("postgres_changes", { event: "*", schema: "public", table: "applications" },
      function () { if (USER) loadApps(); }).subscribe();
    // Coming back to the page (e.g. switching apps on the phone) also refreshes the list.
    document.addEventListener("visibilitychange", function () { if (!document.hidden) syncHidden(); });
    db.auth.onAuthStateChange(function (event, session) {
      USER = session ? session.user : null;
      showAccount();
      syncHidden();
      if (USER) { loadCv(); loadApps(); }
    });
  }

  // =====================================================================
  // Applications (after login): a job is tracked only once I actually apply.
  // One row per application in the private table "applications" (supabase/schema.sql).
  // =====================================================================
  var APPS = [];
  var showingApps = false;
  var STAGES = [["applied", "Applied"], ["interviewing", "Interviewing"], ["offer", "Offer"], ["closed", "Closed"]];
  var CLOSED_REASONS = ["rejected", "withdrawn", "no answer", "accepted"];

  function today() { return new Date().toISOString().slice(0, 10); }

  function appStatus(text) { document.getElementById("apps-status").textContent = text; }

  function loadApps() {
    db.from("applications").select("*").order("applied_on", { ascending: false }).then(function (result) {
      if (result.error) { appStatus("Could not load applications: " + result.error.message); return; }
      APPS = result.data;
      showAccount();
      renderApps();
      renderBoard();
    });
  }

  function applicationFor(job) {
    for (var i = 0; i < APPS.length; i++) if (APPS[i].job_id === job.id) return APPS[i];
    return null;
  }

  // Save a new application, then show it everywhere.
  var FOLLOW_UP_DAYS = 7; // agreed default: chase a reply one week after applying

  function addDays(isoDate, days) {
    var date = new Date(isoDate + "T00:00:00Z");
    date.setUTCDate(date.getUTCDate() + days);
    return date.toISOString().slice(0, 10);
  }

  // An application needs attention when its next step's date is today or earlier.
  function isDue(app) { return app.stage !== "closed" && app.next_due && app.next_due <= today(); }

  function createApplication(row) {
    row.timeline = [{ date: today(), text: "Applied" }];
    row.next_step = "Follow up if no reply";
    row.next_due = addDays(today(), FOLLOW_UP_DAYS);
    return db.from("applications").insert(row).select().then(function (result) {
      if (result.error) { appStatus("Could not save: " + result.error.message); return; }
      APPS = result.data.concat(APPS);
      showAccount();
      renderApps();
      renderBoard();
    });
  }

  // On a job card: "I applied", or a tag once the application exists.
  function appliedButton(job) {
    if (applicationFor(job)) return el("span", "tag applied-tag", "applied");
    var button = el("button", "hide", "I applied");
    button.type = "button";
    button.title = "Start tracking this application (only once you have actually applied)";
    button.addEventListener("click", function () {
      button.disabled = true;
      createApplication({ job_id: job.id, link: job.url, company: job.company, title: job.title,
                          location: job.location, source: "scan" });
    });
    return button;
  }

  // Stage dropdown value: "applied", ..., or "closed:rejected" etc.
  function stageValue(app) { return app.stage === "closed" ? "closed:" + (app.closed_reason || "") : app.stage; }

  function setStage(app, value) {
    var parts = value.split(":");
    var label = parts[0] === "closed" ? "Closed (" + parts[1] + ")" : value.charAt(0).toUpperCase() + value.slice(1);
    var change = { stage: parts[0], closed_reason: parts[1] || null, updated_at: new Date().toISOString(),
                   next_step: parts[0] === "closed" ? null : app.next_step,
                   next_due: parts[0] === "closed" ? null : app.next_due,
                   timeline: (app.timeline || []).concat([{ date: today(), text: label }]) };
    db.from("applications").update(change).eq("id", app.id).then(function (result) {
      if (result.error) { appStatus("Could not move it: " + result.error.message); return; }
      Object.assign(app, change);
      renderApps();
    });
  }

  function saveNext(app, step, dueDate) {
    var change = { next_step: step || null, next_due: dueDate || null, updated_at: new Date().toISOString() };
    if (change.next_step === (app.next_step || null) && change.next_due === (app.next_due || null)) return;
    db.from("applications").update(change).eq("id", app.id).then(function (result) {
      if (result.error) { appStatus("Could not save the next step: " + result.error.message); return; }
      Object.assign(app, change);
      showAccount();
      renderApps();
    });
  }

  function saveNotes(app, text) {
    if (text === (app.notes || "")) return;
    db.from("applications").update({ notes: text, updated_at: new Date().toISOString() }).eq("id", app.id)
      .then(function (result) {
        if (result.error) { appStatus("Could not save the notes: " + result.error.message); return; }
        app.notes = text;
        appStatus("Notes saved.");
      });
  }

  function removeApp(app) {
    if (!confirm("Remove the application to " + app.company + " - " + app.title + "?")) return;
    db.from("applications").delete().eq("id", app.id).then(function (result) {
      if (result.error) { appStatus("Could not remove it: " + result.error.message); return; }
      APPS = APPS.filter(function (other) { return other.id !== app.id; });
      showAccount();
      renderApps();
      renderBoard();
    });
  }

  function appCard(app) {
    var node = el("article", "card" + (isDue(app) ? " overdue" : ""));
    var top = el("div", "top");
    top.appendChild(el("span", "company", app.company));
    top.appendChild(el("span", "tag", app.source === "scan" ? "from board" : app.source));
    node.appendChild(top);
    var link = el(app.link ? "a" : "span", "title", app.title);
    if (app.link) { link.href = app.link; link.target = "_blank"; link.rel = "noopener"; }
    node.appendChild(link);
    var days = Math.floor((Date.now() - new Date(app.applied_on)) / 86400000);
    node.appendChild(el("div", "meta", (app.location ? app.location + " · " : "") +
                        "applied " + app.applied_on + " (" + days + " days ago)"));

    var stage = document.createElement("select");
    stage.className = "stage";
    STAGES.forEach(function (s) {
      if (s[0] === "closed") {
        CLOSED_REASONS.forEach(function (reason) {
          var option = el("option", "", "Closed: " + reason);
          option.value = "closed:" + reason;
          stage.appendChild(option);
        });
      } else {
        var option = el("option", "", s[1]);
        option.value = s[0];
        stage.appendChild(option);
      }
    });
    stage.value = stageValue(app);
    stage.addEventListener("change", function () { setStage(app, stage.value); });

    var notes = el("textarea", "notes");
    notes.placeholder = "Notes (who you talked to, what was said...)";
    notes.value = app.notes || "";
    notes.addEventListener("blur", function () { saveNotes(app, notes.value); });

    var remove = el("button", "hide", "Remove");
    remove.type = "button";
    remove.addEventListener("click", function () { removeApp(app); });

    if (app.stage !== "closed") {
      var next = el("div", "next");
      var step = el("input");
      step.type = "text";
      step.placeholder = "Next step";
      step.value = app.next_step || "";
      var dueDate = el("input");
      dueDate.type = "date";
      dueDate.value = app.next_due || "";
      [step, dueDate].forEach(function (input) {
        input.addEventListener("change", function () { saveNext(app, step.value.trim(), dueDate.value); });
      });
      next.appendChild(step);
      next.appendChild(dueDate);
      if (isDue(app)) node.appendChild(el("div", "due", app.next_due === today() ? "Due today" : "Overdue since " + app.next_due));
      node.appendChild(next);
    }

    var bottom = el("div", "bottom");
    bottom.appendChild(stage);
    bottom.appendChild(remove);
    node.appendChild(bottom);
    node.appendChild(notes);
    if ((app.timeline || []).length) {
      node.appendChild(el("div", "history", app.timeline.map(function (t) { return t.date + " " + t.text; }).join(" · ")));
    }
    return node;
  }

  function renderApps() {
    var box = document.getElementById("apps-board");
    box.textContent = "";
    STAGES.forEach(function (s) {
      var apps = APPS.filter(function (app) { return app.stage === s[0]; });
      apps.sort(function (a, b) { return (a.next_due || "9999") < (b.next_due || "9999") ? -1 : 1; });
      var section = el("section", "column");
      var heading = el("h2", "", s[1] + " ");
      heading.appendChild(el("span", "count", String(apps.length)));
      section.appendChild(heading);
      if (!apps.length) section.appendChild(el("p", "empty", "Nothing here."));
      apps.forEach(function (app) { section.appendChild(appCard(app)); });
      box.appendChild(section);
    });
  }

  // Switch between the job board and my applications.
  function toggleApps() {
    showingApps = !showingApps;
    ["stats", "board"].forEach(function (id) { document.getElementById(id).hidden = showingApps; });
    document.querySelector(".filters").hidden = showingApps;
    document.getElementById("apps").hidden = !showingApps;
    document.getElementById("apps-toggle").setAttribute("aria-pressed", String(showingApps));
  }

  document.getElementById("apps-toggle").addEventListener("click", toggleApps);
  document.getElementById("app-add").addEventListener("click", function () {
    var fields = {};
    ["link", "company", "title", "location", "source"].forEach(function (name) {
      fields[name] = document.getElementById("app-" + name).value.trim();
    });
    if (!fields.company || !fields.title) { appStatus("Company and role are needed."); return; }
    createApplication(fields).then(function () {
      ["link", "company", "title", "location"].forEach(function (name) { document.getElementById("app-" + name).value = ""; });
    });
  });

  document.getElementById("account-toggle").addEventListener("click", function () { toggleAccountBox(); });
  document.getElementById("account-send").addEventListener("click", function () {
    var email = document.getElementById("account-email").value.trim();
    var status = document.getElementById("account-status");
    if (!email) { status.textContent = "Type your email first."; return; }
    status.textContent = "Sending...";
    db.auth.signInWithOtp({ email: email, options: { emailRedirectTo: location.origin + location.pathname } })
      .then(function (result) {
        status.textContent = result.error ? "Could not send: " + result.error.message
          : "Check your inbox and open the link on this device.";
      });
  });
  document.getElementById("account-logout").addEventListener("click", function () {
    db.auth.signOut().then(function () { location.reload(); });
  });

  document.getElementById("cv-save").addEventListener("click", saveCv);

  renderStats();
  // The page title and the Location chips come from the user's Preferences.
  document.title = DATA.page_title;
  document.getElementById("page-title").textContent = DATA.page_title;
  renderChips("place-filter", "place", [["All", "All"]].concat(DATA.places.map(function (p) { return [p, p]; })));
  renderChips("role-filter", "role", [["All", "All"], ["core", "Core"], ["also", "Also interested"]]);
  document.getElementById("show-hidden").addEventListener("change", function (e) {
    showHidden = e.target.checked;
    renderBoard();
  });
  renderBoard();
  startAccount();
</script>
