# Runs jobwatch on a schedule so no computer of yours needs to stay on.
#
# JobScout: no email and no secrets. New matches are written to
# new_matches.jsonl and published as a job board web page on the `gh-pages`
# branch (GitHub Pages). See JOBSCOUT.md.
#
# State (which jobs were already seen) lives on a dedicated `state`
# branch as normal linear history — runners are wiped between runs, a branch
# is not. Missing state is bootstrapped only by an explicit manual run; a
# failed restore stops the run instead of risking replacement state.
# A bootstrap does NOT seed silently here: every job matching today goes
# onto the board, so the page starts full instead of empty.

name: jobwatch

on:
  schedule:
    - cron: "13 * * * *" # every hour (UTC); odd minute avoids the on-the-hour rush
  workflow_dispatch:
    inputs:
      initialize_state:
        description: "Initialize a missing state branch (puts every job matching today on the board)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write # to push the state branch

concurrency:
  group: jobwatch-state # never let two runs race on the state branch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Hosted runners hard-kill jobs at 360 minutes. The poll step has its own
    # shorter timeout so summary/publication can run after an ordinary poll
    # failure; cancellation or the job hard limit cannot guarantee that.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Restore state from the state branch
        id: restore
        run: |
          go run ./cmd/statebranch restore \
            --remote origin \
            --branch state \
            --state state.json \
            --allow-bootstrap="${{ github.event_name == 'workflow_dispatch' && inputs.initialize_state }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build
        id: build
        run: |
          python3 -m unittest scripts/test_run_summary.py
          go test ./...
          go vet ./...
          go build -o jobwatch ./cmd/jobwatch

      - name: Poll job boards
        id: poll
        # A backlog sweep (LLM-matching hundreds of new postings) can run for
        # hours. jobwatch checkpoints state to disk every minute and after
        # every board, bounding lost work when this step fails and the later
        # publication step is still allowed to run. The 10-minute gap to the
        # job timeout leaves room for that publication; explicit cancellation
        # and a job-level hard timeout intentionally publish nothing.
        timeout-minutes: 345
        run: |
          set -o pipefail
          case "${{ steps.restore.outputs.mode }}" in
            restored)
              # The console notifier writes human match bodies and URLs to
              # stdout. Scheduled logs retain only the sanitized logger
              # protocol on stderr; email notification behavior is unchanged.
              ./jobwatch -config jobscout.yaml -state state.json \
                2>&1 > /dev/null | tee run.log
              ;;
            bootstrap)
              ./jobwatch -config jobscout.yaml -state state.json \
                2>&1 > /dev/null | tee run.log
              ;;
            *)
              echo "invalid state restore mode: ${{ steps.restore.outputs.mode }}" >&2
              exit 1
              ;;
          esac

      - name: Publish job board
        id: page
        # Runs before the state is saved: if saving state fails, the next run
        # re-delivers the same matches and build_page.py ignores duplicates.
        if: >-
          ${{
            !cancelled() &&
            steps.build.outcome == 'success' &&
            (steps.poll.outcome == 'success' || steps.poll.outcome == 'failure')
          }}
        run: |
          git config user.name "jobscout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Check out the gh-pages branch (the published site) into ./site,
          # or start it empty on the very first run.
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth 1 origin gh-pages:refs/remotes/origin/gh-pages
            git worktree add -B gh-pages site origin/gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi
          touch new_matches.jsonl
          python3 jobscout/build_page.py new_matches.jsonl site
          cd site
          touch .nojekyll
          git add -A
          git commit -q -m "Update job board" || exit 0
          git push origin gh-pages

      - name: Publish state
        id: publish
        # A restored run may have valid checkpoints even when polling fails.
        # A bootstrap is publishable only after the complete seed succeeds.
        if: >-
          ${{
            !cancelled() &&
            steps.restore.outcome == 'success' &&
            steps.build.outcome == 'success' &&
            (steps.poll.outcome == 'success' || steps.poll.outcome == 'failure') &&
            (steps.restore.outputs.mode == 'restored' || steps.poll.outcome == 'success')
          }}
        run: |
          go run ./cmd/statebranch publish \
            --remote origin \
            --branch state \
            --state state.json \
            --mode "${{ steps.restore.outputs.mode }}" \
            --base-sha "${{ steps.restore.outputs.base_sha }}" \
            --source-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish run summary
        if: always()
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          RESTORE_MODE: ${{ steps.restore.outputs.mode }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          POLL_OUTCOME: ${{ steps.poll.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PUBLISH_CHANGED: ${{ steps.publish.outputs.changed }}
          PUBLISH_SHA: ${{ steps.publish.outputs.publish_sha }}
        run: |
          python3 scripts/run_summary.py \
            --log run.log \
            --restore "$RESTORE_OUTCOME" \
            --restore-mode "$RESTORE_MODE" \
            --build "$BUILD_OUTCOME" \
            --poll "$POLL_OUTCOME" \
            --publish "$PUBLISH_OUTCOME" \
            --publish-changed "$PUBLISH_CHANGED" \
            --publish-sha "$PUBLISH_SHA" \
            >> "$GITHUB_STEP_SUMMARY"
