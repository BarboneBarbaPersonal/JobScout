# JobScout: manual "what would match right now?" run.
# Builds jobwatch and runs it with -dry-run: prints every job that passes
# the filters in jobscout.yaml. Sends no email and saves no state, so it is
# safe to run any time you tweak the keywords.
#
# Run it from: Actions tab -> "dry-run" -> Run workflow.

name: dry-run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build and test
        run: |
          go test ./...
          go vet ./...
          go build -o jobwatch ./cmd/jobwatch

      - name: Show current matches
        run: ./jobwatch -config jobscout.yaml -dry-run
