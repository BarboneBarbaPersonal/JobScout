# Scan every hour: read the Google Sheet, check all job boards, publish the page.
name: Scan

on:
  schedule:
    - cron: "13 * * * *" # every hour at :13 (GitHub may start it a little later)
  workflow_dispatch: # the "Run workflow" button

permissions:
  contents: write # to publish the page on the gh-pages branch

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The page published by the last scan (keeps each job's "found" date).
      - name: Get the current page
        run: |
          git fetch --depth 1 origin gh-pages && git worktree add site origin/gh-pages || mkdir -p site

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # freehire's crawling engine, at the version pinned in engine/FREEHIRE_VERSION,
      # plus our runner (engine/main.go). See docs/MERGE-SPEC.md.
      - name: Engine version
        id: engine
        run: echo "sha=$(cat engine/FREEHIRE_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: strelov1/freehire
          ref: ${{ steps.engine.outputs.sha }}
          path: freehire
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: freehire/go.mod
          cache-dependency-path: freehire/go.sum
      - name: Build the engine
        run: |
          mkdir -p freehire/cmd/jobscout-scan
          cp engine/main.go freehire/cmd/jobscout-scan/main.go
          cd freehire && go build -o ../jobscout-engine ./cmd/jobscout-scan

      # Remembered between scans, never published: which board each company uses.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: cache
          key: scan-${{ github.run_id }}
          restore-keys: scan-

      - name: Scan
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          JOBSCOUT_ENGINE: ./jobscout-engine
        run: python -m scout.main site

      # Only main publishes. A test run from another branch keeps the page as a download.
      - name: Keep the test page
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-page
          path: site/*.*
      - name: Publish the page
        if: github.ref == 'refs/heads/main'
        run: |
          cd site
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "JobScout"
          git config user.email "jobscout@users.noreply.github.com"
          git add index.html matches.json runs.json
          git commit -q -m "Scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
